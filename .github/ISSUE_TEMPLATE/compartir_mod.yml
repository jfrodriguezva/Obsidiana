name: Compartir un mod
description: Un mod (pueblos, atuendos o música) para que otras personas lo usen y, si se revisa, entre al juego.
title: "[Mod] "
labels: ["mod"]
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre del mod
    validations:
      required: true
  - type: textarea
    id: que
    attributes:
      label: Qué agrega
    validations:
      required: true
  - type: textarea
    id: texto
    attributes:
      label: Texto del mod
      description: El JSON completo, tal como se pega en Comunidad → Mods.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: revisado
    attributes:
      label: Revisión
      options:
        - label: Se instala sin errores en Comunidad → Mods.
          required: true
        - label: Cada pueblo cita su fuente.
          required: true
